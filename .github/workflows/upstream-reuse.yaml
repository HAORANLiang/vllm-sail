name: Upstream test reuse gate

on:
  workflow_call:
    inputs:
      pr_mode:
        type: boolean
        default: false
      pr_head_sha:
        type: string
        default: ""
      build_run_id:
        required: true
        type: string
      wheel_source_sha:
        type: string
        default: ""

permissions:
  contents: read
  actions: read
cache-mode: none

jobs:
  cpu-reuse:
    name: CPU upstream reuse
    uses: ./.github/workflows/_ppu-upstream-reuse.yaml
    with:
      target: cpu
      pr_mode: ${{ inputs.pr_mode }}
      pr_head_sha: ${{ inputs.pr_head_sha }}
      build_run_id: ${{ inputs.build_run_id }}
      wheel_source_sha: ${{ inputs.wheel_source_sha }}

  m890-reuse:
    name: M890 upstream reuse
    needs: cpu-reuse
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/_ppu-upstream-reuse.yaml
    with:
      target: 890p
      pr_mode: ${{ inputs.pr_mode }}
      pr_head_sha: ${{ inputs.pr_head_sha }}
      build_run_id: ${{ inputs.build_run_id }}
      wheel_source_sha: ${{ inputs.wheel_source_sha }}
